name: Publish to Reposilite Snapshots

on:
  workflow_dispatch:
    inputs:
      perform-a-gradle-clean:
        description: "Perform a Gradle clean"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: [ self-hosted, Android ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Perform a Gradle clean, as requested
        if: ${{ github.event.inputs.perform-a-gradle-clean == 'true' }}
        run: ./gradlew clean

      - name: Publish snapshots
        run: ./gradlew publishAllPublicationsToReposiliteRepository -Psnapshot
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
  reposiliteUsername: ${{ secrets.REPOSILITE_USERNAME }}
  reposilitePassword: ${{ secrets.REPOSILITE_PASSWORD }}
  GPG_key_id: ${{ secrets.GPG_KEY_ID }}
  GPG_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
  GPG_private_password: ${{ secrets.GPG_PRIVATE_PASSWORD }}
